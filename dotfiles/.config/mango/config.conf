# ── Environment ───────────────────────────────────────────────────────────────
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_DESKTOP,Mango
env=XDG_SESSION_TYPE,wayland
env=MOZ_ENABLE_WAYLAND,1
env=GTK_THEME,Gruvbox-BL-LB-Dark
env=QT_QPA_PLATFORM,wayland;xcb
env=QT_QPA_PLATFORMTHEME,qt6ct
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=GDK_BACKEND,wayland,x11,*
env=WLR_NO_HARDWARE_CURSORS,1
env=PATH,/home/ebits/.bun/bin:/home/ebits/.local/go/bin:/opt/cuda/bin:/usr/local/sbin:/usr/local/bin:/usr/bin:/bin

# ── Effects ───────────────────────────────────────────────────────────────────
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=3
blur_params_radius=8
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

shadows=0
layer_shadows=0
shadow_only_floating=1
shadows_size=10
shadows_blur=15
shadows_position_x=0
shadows_position_y=0
shadows_color=0x000000ff

border_radius=6
no_radius_when_single=0
focused_opacity=0.8
unfocused_opacity=0.7

# ── Animations ────────────────────────────────────────────────────────────────
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=0
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=200
animation_duration_open=200
animation_duration_tag=200
animation_duration_close=200
animation_duration_focus=200
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# ── Scroller layout 
scroller_structs=20
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=1
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=0.5
scroller_proportion_preset=0.5,0.8,1.0

# Other layouts
new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_num=9
smart_gaps=0
circle_layout=tile,scroller,dwindle

# ── Overview ──────────────────────────────────────────────────────────────────
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5
title_message_bar_height=52
title_message_bar_gap=20

# ── Misc ──────────────────────────────────────────────────────────────────────
xwayland_persistence=1
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=1
snap_distance=50
float_full_to_top=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# ── Keyboard ──────────────────────────────────────────────────────────────────
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us

# ── Trackpad / mouse ──────────────────────────────────────────────────────────
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1
mouse_natural_scrolling=0
mouse_accel_speed=0.0

# ── Appearance (Gruvbox) ──────────────────────────────────────────────────────
gap_inner_horizontal=12
gap_inner_vertical=12
gap_outer_horizontal=12
gap_outer_vertical=12
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=3
root_color=0x201b14ff
border_color=0x504945ff
focus_color=0xdfa658ff
drop_color=0x8fba7c55
split_color=0xeb441eff
maximized_screen_color=0x89aa61ff
urgent_color=0xad401fff
scratchpad_color=0x516c93ff
global_color=0xb153a7ff
overlay_color=0x14a57cff

# ── Tags use the scroller layout by default ───────────────────────────────────
tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:scroller
tag_rule=id:8,layout_name:scroller
tag_rule=id:9,layout_name:scroller

# ── Autostart ─────────────────────────────────────────────────────────────────
exec_once=swaybg -i /home/ebits/Pictures/wallpapers/sushi.jpg
exec_once=waybar -c /home/ebits/.config/mango/waybar/config.jsonc -s /home/ebits/.config/mango/waybar/style.css
exec_once=fnott
exec_once=systemctl --user start xdg-desktop-portal

# ── Keybindings ───────────────────────────────────────────────────────────────
# Apps
bind=SUPER,q,spawn,kitty
bind=SUPER,Return,spawn,env GDK_BACKEND=wayland emacs
bind=SUPER,r,spawn,fuzzel
bind=SUPER,w,spawn,firefox
bind=SUPER,b,spawn_shell,~/.config/fuzzel/fuzzel-bluetooth.sh
bind=SUPER,u,spawn_shell,~/.config/fuzzel/fuzzel-emoji.sh
bind=SUPER+SHIFT,s,spawn_shell,~/.config/fuzzel/fuzzel-search.sh

# Session and window state
bind=SUPER,c,killclient
bind=SUPER,f,togglefullscreen
bind=SUPER+SHIFT,f,togglefakefullscreen
bind=SUPER,v,togglefloating
bind=SUPER,g,toggleglobal
bind=SUPER,i,minimized
bind=SUPER+SHIFT,i,restore_minimized
bind=SUPER,z,toggle_scratchpad
bind=SUPER+SHIFT,e,spawn_shell,~/.config/niri/scripts/swaylock.sh
bind=SUPER,s,spawn,sshot -s
bind=SUPER+SHIFT,m,quit
bind=SUPER,p,reload_config

# Scroller width
bind=SUPER,minus,set_proportion,0.5
bind=SUPER,equal,switch_proportion_preset

# Focus (hjkl)
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up

# Move windows (hjkl)
bind=SUPER+SHIFT,h,move_client,left
bind=SUPER+SHIFT,l,move_client,right
bind=SUPER+SHIFT,j,move_client,down
bind=SUPER+SHIFT,k,move_client,up

# Tags
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Tag / monitor navigation
bind=SUPER,Left,viewtoleft,0
bind=SUPER,Right,viewtoright,0
bind=SUPER+CTRL,Left,viewtoleft_have_client,0
bind=SUPER+CTRL,Right,viewtoright_have_client,0
bind=SUPER+ALT,Left,focusmon,left
bind=SUPER+ALT,Right,focusmon,right
bind=SUPER+ALT,Up,focusmon,up
bind=SUPER+ALT,Down,focusmon,down
bind=SUPER+ALT+SHIFT,Left,tagmon,left
bind=SUPER+ALT+SHIFT,Right,tagmon,right
bind=SUPER+ALT+SHIFT,Up,tagmon,up
bind=SUPER+ALT+SHIFT,Down,tagmon,down

# Layouts
bind=SUPER,n,switch_layout
bind=SUPER+CTRL,i,setlayout,tile
bind=SUPER+CTRL,l,setlayout,scroller
bind=SUPER+CTRL,d,setlayout,dwindle

# Gaps
bind=SUPER+SHIFT,x,incgaps,1
bind=SUPER+SHIFT,z,incgaps,-1
bind=SUPER+SHIFT,r,togglegaps

# Overview / window switcher
bind=SUPER,Tab,overcircle,next

# Media keys
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 2%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 2%-

# ── Mouse ─────────────────────────────────────────────────────────────────────
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=NONE,btn_middle,togglemaximizescreen,0

axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview

# ── Window rules ──────────────────────────────────────────────────────────────
window_rule=is_floating:1,app_id:waypaper
window_rule=is_floating:1,app_id:nwg-look
window_rule=is_floating:1,app_id:feh
window_rule=is_floating:1,app_id:xdg-desktop-portal-gtk
# Kept transparent so blur is visible in the terminal; uncomment to force solid foot.
# window_rule=unfocused_opacity:1.0,focused_opacity:1.0,app_id:^foot$

# ── Layer rules ───────────────────────────────────────────────────────────────
layer_rule=no_animation:1,no_shadow:1,layer_name:selection
layer_rule=no_shadow:1,layer_name:waybar
layer_rule=no_shadow:1,layer_name:fnott
layer_rule=animation_type_open:zoom,layer_name:launcher
layer_rule=animation_type_close:zoom,layer_name:launcher
