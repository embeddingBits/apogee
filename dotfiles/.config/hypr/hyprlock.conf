
source = $HOME/.config/hypr/gruvbox.conf

$accent = $lavender
$accentAlpha = $lavenderAlpha
$font = JetBrainsMono Nerd Font

# GENERAL

general {
    disable_loading_bar = true
    hide_cursor = true
    immediate_render = false
}

# ANIMATIONS

animations {
    enabled = true

    bezier = easeOutCubic, 0.22, 1, 0.36, 1
    bezier = easeInOutCubic, 0.65, 0, 0.35, 1

	animation = fadeIn, 0, 3, easeOutCubic
    animation = fadeOut, 1, 3, easeInOutCubic

    animation = inputFieldWidth, 1, 5, easeOutCubic
    animation = inputFieldFade, 1, 5, easeOutCubic
    animation = inputFieldDots, 1, 5, easeOutCubic
    animation = inputFieldColors, 1, 5, easeInOutCubic
}

# BACKGROUND

background {
    monitor =
    path = ~/Pictures/wallpapers/japan_stores.webp
    blur_passes = 2
    blur_size = 8
    color = $base
}

# CENTER CLOCK

label {
    monitor =

	text = cmd[update:1000] echo "<b>$(date +"%H:%M")</b>"

    color = $text
    font_size = 112
    font_family = JetBrainsMono Nerd Font Bold

    shadow_passes = 0
    shadow_size = 0

    position = 0, 85
    halign = center
    valign = center
}

# DATE AND DAY

label {
    monitor =

	text = cmd[update:60000] echo "<b>$(date +"%A, %d %B")</b>"

    color = $yellow
    font_size = 25
    font_family = JetBrainsMono Nerd Font Bold

    shadow_passes = 0
    shadow_size = 0

    position = 0, -65
    halign = center
    valign = center
}

# DYNAMIC ISLAND STYLE PASSWORD FIELD

input-field {
    monitor =

    size = 340, 64
    outline_thickness = 2
    rounding = 32

    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true

    outer_color = $accent
    inner_color = $surface0
    font_color = $text

    font_family = $font
    font_size = 16

    fade_on_empty = true
    hide_input = false

    placeholder_text = <span foreground="##$blueAlpha">󰌾  Enter password</span>

    check_color = $accent
    fail_color = $red

    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $yellow

    shadow_passes = 0
    shadow_size = 0

    position = 0, -190
    halign = center
    valign = center
}

# SYSTEM STATUS

label {
    monitor =

    text = cmd[update:5000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/status.sh

    color = $red
    font_size = 16
    font_family = JetBrainsMono Nerd Font Bold

    position = -850, 80
    halign = center
    valign = bottom
}

# USER INFORMATION

label {
    monitor =

    text = cmd[update:5000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/user.sh

    color = $yellow
    font_size = 16
    font_family = JetBrainsMono Nerd Font Bold

    position = 800, 80
    halign = center
    valign = bottom
}

# CURRENTLY PLAYING

label {
    monitor =

    text = cmd[update:5000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/playing.sh

    color = $blue
    font_size = 14
    font_family = JetBrainsMono Nerd Font Bold

    position = 0, 80
    halign = center
    valign = bottom
}

