unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-s

set -g mouse on

set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set-option -g status-position top

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

# General settings
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify absolute-centre

# Gruvbox palette
set -g @gb_bg       "#282828"
set -g @gb_bg1      "#3c3836"
set -g @gb_bg2      "#504945"
set -g @gb_fg       "#ebdbb2"
set -g @gb_gray     "#a89984"
set -g @gb_red      "#fb4934"
set -g @gb_green    "#b8bb26"
set -g @gb_yellow   "#fabd2f"
set -g @gb_blue     "#83a598"
set -g @gb_purple   "#d3869b"
set -g @gb_aqua     "#8ec07c"
set -g @gb_orange   "#fe8019"

# Status bar
set -g status-style "bg=default,fg=#ebdbb2"
set -g status-left-length 100
set -g status-right-length 100

# Left: Session | Current command | Directory
set -g status-left \
'#[fg=#282828,bg=#fabd2f,bold] 󰆍 #S #[fg=#fabd2f,bg=default]'

set -ga status-left \
'#[fg=#83a598,bg=default] 󰆍 #[fg=#ebdbb2]#{pane_current_command} '

set -ga status-left \
'#[fg=#a89984]│ #[fg=#83a598]  '

set -ga status-left \
'#[fg=#ebdbb2]#{b:pane_current_path} '

# Window indicators

# Inactive window
set -g window-status-format \
'#[fg=#a89984,bg=default]   #[fg=#a89984]#I '

# Active window
set -g window-status-current-format \
'#[fg=#fabd2f,bg=default,bold] 󰝥  #[fg=#ebdbb2,bold]#I '

# No separator
set -g window-status-separator ""

# Right: Battery | Uptime | Date

# Battery percentage using Linux sysfs
# Uses the first detected battery.
set -g status-right \
'#[fg=#b8bb26]󰁹 '

set -ga status-right \
'#[fg=#ebdbb2]#(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1 | sed "s/$/%/") '

set -ga status-right \
'#[fg=#504945]│ '

# System uptime
set -ga status-right \
'#[fg=#83a598]󰔟 '

set -ga status-right \
'#[fg=#ebdbb2]#(uptime -p | sed -E "s/^up //; s/,//g; s/ hours?/h/; s/ minutes?/min/; s/ days?/d/") '

set -ga status-right \
'#[fg=#504945]│ '

# Date and time
set -ga status-right \
'#[fg=#fabd2f]󰃭 '

set -ga status-right \
'#[fg=#ebdbb2]%d %b %H:%M '

# Message styling
set -g message-style \
'bg=#fabd2f,fg=#282828,bold'

set -g message-command-style \
'bg=#3c3836,fg=#fabd2f,bold'

# Pane borders
set -g pane-active-border-style \
'fg=#83a598'

set -g pane-border-style \
'fg=#504945'

# Clock
set -g clock-mode-colour "#fabd2f"
set -g clock-mode-style 24

